name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      # Hard gate. This is the step that catches duplicate JSX attributes
      # (TS17001), which is how two accessibility PRs silently merged a worse
      # label over a better one — git saw non-overlapping additions to the same
      # element and never raised a conflict.
      - name: Type-check (node + web)
        run: npm run typecheck

      - name: Build (electron-vite)
        run: npm run build

      - name: Run tests
        run: npm test --silent

      - name: Run security audit
        run: npm audit --audit-level=high || true
